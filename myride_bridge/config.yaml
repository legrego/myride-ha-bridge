name: MyRide Bus Bridge
version: "1.1.0"
slug: myride_bridge
description: Real-time MyRide K-12 school bus tracking via MQTT
url: https://github.com/legrego/myride-ha-bridge
arch:
  - aarch64
  - amd64
image: ghcr.io/legrego/myride-ha-bridge-addon
startup: application
boot: auto
services:
  - mqtt:need
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Status page and POST /token
options:
  tenant_id: ""
  refresh_token: ""
  timezone: America/New_York
  approach_radius_meters: 500
  bus_filter: ""
  log_level: info
schema:
  tenant_id: str
  refresh_token: password?
  timezone: str
  approach_radius_meters: int(1,)
  bus_filter: str?
  log_level: list(debug|info|warn|error)
