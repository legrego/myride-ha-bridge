# https://contributors.home-assistant.io/apps/reference/configuration/
name: MyRide Bus Bridge
version: "1.3.0"
slug: myride_bridge
description: Real-time MyRide K-12 school bus tracking via MQTT
url: https://github.com/legrego/myride-ha-bridge/tree/main/myride_bridge
arch:
  - aarch64
  - amd64
image: ghcr.io/legrego/myride-ha-bridge-addon
startup: application
boot: auto
services:
  - mqtt:need
ingress: true
panel_icon: mdi:bus-school
panel_title: School Bus
watchdog: http://[HOST]:[PORT:8099]/status
options:
  approach_radius_meters: 500
  log_level: info
schema:
  tenant_id: match(^[0-9a-fA-F-]{36}$)?
  refresh_token: password?
  timezone: str?
  approach_radius_meters: int(1,)
  bus_filter: str?
  log_level: list(debug|info|warn|error)
