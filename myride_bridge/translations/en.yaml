configuration:
  tenant_id:
    name: Tenant ID
    description: Your district's MyRide ID. The token snippet prints it (see the Documentation tab).
  refresh_token:
    name: Refresh token
    description: >-
      Your MyRide sign-in token. The token snippet prints it (see the
      Documentation tab). Keep it set. To replace an expired token, paste the new
      one on the School Bus status page, which then takes precedence over this
      option.
  timezone:
    name: District time zone
    description: >-
      IANA time zone of the school district, such as America/Chicago. Leave empty
      to use your Home Assistant time zone.
  approach_radius_meters:
    name: Approach radius
    description: Distance in meters at which the "Approaching Stop" sensor turns on.
  bus_filter:
    name: Bus filter
    description: >-
      Optional. Track only this bus, such as BUS 042. Leave empty to follow each
      student's assigned bus automatically, including substitutes.
  log_level:
    name: Log level
    description: How much detail to write to the add-on log.
