name: Build Home Assistant add-on image

# Builds the add-on image with Home Assistant's builder actions: one native
# runner per architecture, io.hass.* labels, Cosign signing, and a multi-arch
# manifest at the `image` named in myride_bridge/config.yaml. Pull requests
# build without pushing. A version that is already published is never
# overwritten (skip-existing): bump `version` to release.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  APP_DIR: myride_bridge

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.info.outputs.image_name }}
      registry_prefix: ${{ steps.info.outputs.registry_prefix }}
      version: ${{ steps.info.outputs.version }}
      name: ${{ steps.info.outputs.name }}
      description: ${{ steps.info.outputs.description }}
      url: ${{ steps.info.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app information
        id: info
        run: |
          config="${APP_DIR}/config.yaml"
          image=$(yq -r '.image' "$config")
          {
            echo "image_name=${image##*/}"
            echo "registry_prefix=${image%/*}"
            echo "version=$(yq -r '.version' "$config")"
            echo "name=$(yq -r '.name' "$config")"
            echo "description=$(yq -r '.description' "$config")"
            echo "url=$(yq -r '.url // ""' "$config")"
            echo "architectures=$(yq -o=json -I=0 '.arch' "$config")"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.info.outputs.image_name }}
          registry-prefix: ${{ steps.info.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Cosign signing
      packages: write # Push to GHCR
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: .
          file: ./Dockerfile
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          build-args: |
            IMAGE_FLAVOR=addon
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=${{ needs.prepare.outputs.url }}
          push: ${{ github.event_name == 'push' }}
          skip-existing: ${{ needs.prepare.outputs.version }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Cosign signing
      packages: write # Push to GHCR
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
          skip-existing: ${{ needs.prepare.outputs.version }}
